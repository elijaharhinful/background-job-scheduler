name: Backend CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Uncomment the following line once tests are written
      # - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Generate .env file
        run: |
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "NODE_ENV=production" >> .env
          echo "WORKER_COUNT=${{ secrets.WORKER_COUNT }}" >> .env
          echo "CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
          echo "DB_LOGGING=false" >> .env
          echo "STARVATION_CHECK_INTERVAL_MS=30000" >> .env
          echo "AGING_INTERVAL_MIN=5" >> .env
          echo "AGING_BOOST_PER_INTERVAL=0.5" >> .env
          echo "SCHEDULE_TICKER_INTERVAL_MS=1000" >> .env
          echo "DLQ_ALERT_THRESHOLD=10" >> .env
          echo "RESEND_FROM=noreply@dilemma.com" >> .env
          echo "RESEND_ALERT_TO=${{ secrets.RESEND_ALERT_TO }}" >> .env
          echo "MOCK_EMAIL_FAILURE_RATE=0.1" >> .env

      - name: Copy .env to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ".env"
          target: "/var/www/background-job-scheduler"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /var/www/background-job-scheduler
            git pull origin main
            npm ci
            npm run build
            npm run migration:run
            pm2 restart scheduler-api
